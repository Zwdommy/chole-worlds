<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chole 之城 · 她创造的城市</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #ffe0cc;
    user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- 加载页 ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(180deg, #a2d2ff 0%, #cdb4db 45%, #ffd9c0 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.2s ease; color: #6b5b73;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .halo {
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fffdf5 0%, #ffe9a8 45%, rgba(255,233,168,0) 70%);
    animation: breathe 2.4s ease-in-out infinite;
    margin-bottom: 24px;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity:.85 } 50% { transform: scale(1.18); opacity:1 } }
  #loading h1 { font-size: 30px; font-weight: 600; letter-spacing: 6px; margin: 0 0 10px; }
  #loading p  { font-size: 14px; opacity: .75; letter-spacing: 2px; margin: 4px 0; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; z-index: 10; pointer-events: none; color: #5f4b56; }
  #title-card {
    top: 18px; left: 22px;
    background: rgba(255, 252, 246, .72); backdrop-filter: blur(6px);
    border-radius: 16px; padding: 10px 18px;
    box-shadow: 0 4px 18px rgba(180, 140, 120, .18);
  }
  #title-card h1 { margin: 0; font-size: 20px; letter-spacing: 3px; color: #b56576; }
  #title-card p  { margin: 2px 0 0; font-size: 11px; letter-spacing: 2px; opacity: .7; }

  /* ---------- 任务卡 ---------- */
  #quest-card {
    top: 96px; left: 22px; max-width: 240px;
    background: rgba(255, 252, 246, .78); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 10px 14px;
    box-shadow: 0 4px 18px rgba(180, 140, 120, .18);
    border-left: 3px solid #e0a458;
    transition: opacity .6s ease;
  }
  #quest-card .chapter { font-size: 10.5px; letter-spacing: 2px; color: #b56576; opacity: .85; }
  #quest-card .qtitle { font-size: 15px; font-weight: 600; margin: 2px 0; color: #7a5c68; }
  #quest-card .obj { font-size: 12px; opacity: .8; line-height: 1.5; }
  #quest-card .prog { font-size: 12px; color: #e0a458; font-weight: 600; margin-top: 2px; }
  #quest-card.done { opacity: 0; }

  /* ---------- 时间牌 ---------- */
  #time-chip {
    top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 252, 246, .72); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 8px 16px; font-size: 13px; letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(180, 140, 120, .18);
  }

  /* ---------- 幸福度 ---------- */
  #happy-meter {
    top: 64px; right: 20px; display: flex; align-items: center; gap: 7px;
    background: rgba(255, 252, 246, .72); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 7px 14px;
    box-shadow: 0 4px 18px rgba(180, 140, 120, .18);
    font-size: 12.5px;
  }
  #happy-bar {
    width: 90px; height: 8px; border-radius: 99px; overflow: hidden;
    background: rgba(181, 101, 118, .15);
  }
  #happy-fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ffaaa5, #ffd166, #ff8fab);
    transition: width .8s ease;
  }
  #happy-val { color: #b56576; font-weight: 600; min-width: 20px; }

  /* ---------- 剧情对话（Chole 之声） ---------- */
  #toast.story {
    border-color: rgba(255, 143, 171, .65);
    background: linear-gradient(180deg, rgba(255, 250, 243, .96), rgba(255, 240, 246, .94));
    box-shadow: 0 10px 40px rgba(255, 143, 171, .3);
  }
  #toast .speaker {
    display: block; font-size: 12px; letter-spacing: 3px; color: #ff8fab;
    margin-bottom: 3px; font-weight: 600;
  }

  #orb-counter {
    top: 18px; right: 74px;
    background: rgba(255, 252, 246, .72); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 10px 18px;
    font-size: 15px; letter-spacing: 1px;
    box-shadow: 0 4px 18px rgba(180, 140, 120, .18);
  }
  #orb-counter b { color: #e0a458; }

  #hint {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(95, 75, 86, .35); color: #fffaf3;
    border-radius: 999px; padding: 8px 20px; font-size: 12.5px; letter-spacing: 1.5px;
  }

  #toast {
    left: 50%; bottom: 96px; transform: translateX(-50%) translateY(12px);
    max-width: min(560px, 82vw);
    background: rgba(255, 250, 243, .92); backdrop-filter: blur(8px);
    border: 1.5px solid rgba(224, 164, 88, .45);
    border-radius: 18px; padding: 14px 26px; text-align: center;
    font-size: 16px; line-height: 1.7; color: #7a5c68;
    box-shadow: 0 8px 30px rgba(181, 101, 118, .22);
    opacity: 0; transition: opacity .5s ease, transform .5s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #mute-btn {
    position: fixed; top: 18px; right: 20px; z-index: 20;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 18px;
    background: rgba(255, 252, 246, .72); backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(180, 140, 120, .18);
  }
  #mute-btn:hover { transform: scale(1.08); }

  /* ---------- 移动端触控 ---------- */
  #app canvas { touch-action: none; }
  #joystick {
    position: fixed; left: 24px; bottom: 30px; z-index: 30;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255, 252, 246, .22); backdrop-filter: blur(4px);
    border: 1.5px solid rgba(255, 255, 255, .55);
    display: none; touch-action: none;
  }
  #joystick-nub {
    position: absolute; left: 50%; top: 50%;
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255, 252, 246, .88);
    box-shadow: 0 4px 14px rgba(180, 140, 120, .35);
    transform: translate(-50%, -50%);
  }
  #jump-btn {
    position: fixed; right: 30px; bottom: 48px; z-index: 30;
    width: 76px; height: 76px; border-radius: 50%;
    border: none; font-size: 28px; color: #b56576;
    background: rgba(255, 252, 246, .78); backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(180, 140, 120, .3);
    display: none; touch-action: none;
  }
  body.touch #joystick, body.touch #jump-btn { display: block; }
  body.touch #hint { display: none; }
  @media (max-width: 720px) {
    #title-card { padding: 7px 12px; }
    #title-card h1 { font-size: 15px; letter-spacing: 2px; }
    #title-card p { font-size: 9px; }
    #orb-counter { padding: 7px 12px; font-size: 12px; right: 62px; top: 64px; }
    #mute-btn { width: 36px; height: 36px; font-size: 15px; }
    #toast { bottom: 175px; font-size: 14px; padding: 10px 18px; }
    #loading h1 { font-size: 24px; }
    #time-chip { top: auto; bottom: 165px; padding: 5px 12px; font-size: 11px; opacity: .9; }
    #happy-meter { top: 104px; padding: 5px 10px; font-size: 11px; }
    #happy-bar { width: 56px; }
    #quest-card { top: 72px; max-width: 175px; padding: 8px 10px; }
    #quest-card .qtitle { font-size: 13px; }
    #quest-card .obj { font-size: 10.5px; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="loading">
    <div class="halo"></div>
    <h1>Chole 之城</h1>
    <p id="load-status">造物主 Chole 正在为你点亮街灯……</p>
    <p style="margin-top:14px; font-size:12px">WASD 移动 · 空格 跳跃 · 拖动鼠标 转动视角</p>
  </div>

  <div id="title-card" class="hud">
    <h1>Chole 之城</h1>
    <p>造物主 CHOLE 的城市</p>
  </div>
  <div id="orb-counter" class="hud">✨ 光之祝福 <b id="orb-count">0</b> / <span id="orb-total">12</span></div>
  <div id="time-chip" class="hud">🌅 黎明</div>
  <div id="happy-meter" class="hud">🌸<div id="happy-bar"><div id="happy-fill"></div></div><span id="happy-val">0</span></div>
  <div id="quest-card" class="hud" style="display:none">
    <div class="chapter" id="quest-chapter"></div>
    <div class="qtitle" id="quest-title"></div>
    <div class="obj" id="quest-obj"></div>
    <div class="prog" id="quest-prog"></div>
  </div>
  <div id="hint" class="hud">WASD 移动 · 空格 跳跃 · 拖动鼠标 转动视角 · 靠近光球收下 Chole 的祝福</div>
  <div id="toast" class="hud"></div>
  <button id="mute-btn" title="静音 / 取消静音">🔊</button>

  <div id="joystick"><div id="joystick-nub"></div></div>
  <button id="jump-btn">⬆</button>

  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
