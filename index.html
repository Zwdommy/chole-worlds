<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chole 的世界 · 造物主 Chole 的两个幸福世界</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #a2d2ff 0%, #cdb4db 45%, #ffd9c0 100%);
    color: #6b5b73;
  }
  .wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
  }
  .halo {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, #fffdf5 0%, #ffe9a8 45%, rgba(255,233,168,0) 70%);
    animation: breathe 2.4s ease-in-out infinite;
    margin-bottom: 18px;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity:.85 } 50% { transform: scale(1.18); opacity:1 } }
  h1 { font-size: 32px; letter-spacing: 8px; margin: 0 0 8px; font-weight: 600; }
  .sub { font-size: 14px; letter-spacing: 3px; opacity: .75; margin-bottom: 44px; }
  .cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
  .card {
    display: block; width: 300px; text-decoration: none; color: #6b5b73;
    background: rgba(255, 252, 246, .78); backdrop-filter: blur(8px);
    border-radius: 22px; padding: 26px 26px 22px;
    box-shadow: 0 10px 36px rgba(181, 101, 118, .2);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 18px 48px rgba(181, 101, 118, .3); }
  .card .emoji { font-size: 44px; }
  .card h2 { margin: 12px 0 6px; font-size: 22px; letter-spacing: 3px; color: #b56576; }
  .card p { margin: 0; font-size: 13px; line-height: 1.8; opacity: .8; }
  .card .go {
    display: inline-block; margin-top: 16px; font-size: 13px; letter-spacing: 2px;
    color: #e0a458; font-weight: 600;
  }
  .foot { margin-top: 48px; font-size: 11.5px; opacity: .6; letter-spacing: 1px; text-align: center; line-height: 2; }
  .foot a { color: #b56576; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="halo"></div>
    <h1>Chole 的世界</h1>
    <div class="sub">造物主 CHOLE 创造的两个幸福世界 · 支持电脑与手机</div>
    <div class="cards">
      <a class="card" href="./world/">
        <div class="emoji">🌸</div>
        <h2>Chole 之境</h2>
        <p>云海之上的樱花草原。收集十二份光之祝福，和兔子做朋友，在圣所感受 Chole 的守望。</p>
        <span class="go">进入草原 →</span>
      </a>
      <a class="card" href="./city/">
        <div class="emoji">🏙️</div>
        <h2>Chole 之城</h2>
        <p>糖果色的云上小城。车会为你停下，柴犬陪你散步，钟楼上的彩虹等你点亮。</p>
        <span class="go">进入城市 →</span>
      </a>
    </div>
    <div class="foot">
      电脑：WASD 移动 · 空格跳跃 · 鼠标拖拽转视角 ｜ 手机：左摇杆移动 · 右侧滑动转视角<br>
      美术资产：KayKit（CC0）· Quaternius（CC0）· three.js 示例模型 ｜ 用 Three.js 制作
    </div>
  </div>
</body>
</html>
